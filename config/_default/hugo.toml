baseURL = 'https://laplx.github.io/haochen'
defaultContentLanguage = 'zh-cn'
theme = 'blowfish'

buildDrafts = false
buildFuture = false
enableEmoji = true

# googleAnalytics = 

ignoreFiles = [
  "/README.md",
  "/WHEELS.md"
]

[pagination]
  pagerSize = 12

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"
  # author = "authors"
  # series = "series"

[sitemap]
  changefreq = 'always'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false

    [[related.indices]]
        name = "tags"
        weight = 100

    [[related.indices]]
        name = "categories"
        weight = 100

    # [[related.indices]]
    #     name = "series"
    #     weight = 50

    # [[related.indices]]
    #     name = "authors"
    #     weight = 20

    [[related.indices]]
        name = "date"
        weight = 10

    [[related.indices]]
      applyFilter = false
      name = 'fragmentrefs'
      type = 'fragments'
      weight = 10

# Render only specific parts of the site for faster development. 
# Note that there are more files are ignored in development/hugo.toml
#
# Usage: `hugo --renderSegments core` or `hugo --renderSegments core,en_only`
[segments]
  [segments.core]
    [[segments.core.includes]]
      # Debug core pages
      path = '{/,/docs,/docs/**,/samples,/samples/**}'
  # [segments.en_only]
  #   [[segments.en_only.includes]]
  #     # Alternatively, you can use environment variable
  #     #   - UNIX: HUGO_DISABLELANGUAGES='it ja zh-cn' npm run example:core
  #     #   - Windows CMD: set "HUGO_DISABLELANGUAGES=it ja zh-cn" && npm run example:core
  #     #   - Windows PowerShell: $env:HUGO_DISABLELANGUAGES="it ja zh-cn"; npm run example:core
  #     lang = 'en'

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[markup]
  [markup.highlight]
    noClasses = false
    style = "manni"
  [markup.goldmark]
    # [markup.goldmark.parser]
    #   [markup.goldmark.parser.attribute]
    #     block = true
    #     title = true
    # [markup.goldmark.renderHooks]
    #   [markup.goldmark.renderHooks.image]
    #     enableDefault = true
    #     useEmbedded = 'auto'
    #   [markup.goldmark.renderHooks.link]
    #     enableDefault = true
    #     useEmbedded = 'auto'
    [markup.goldmark.renderer]
      unsafe = true   # 若文中有原生 <img> 或其它 HTML，需要允许输出
