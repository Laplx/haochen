baseURL = "https://haochen.info"
disqusShortname = ""
enableGitInfo = true
enableRobotsTXT = true
hasCJKLanguage = true
languageCode = "zh-cn"
rssLimit = 10
theme = "hugo-texify3"
title = "Laplace's Blog"

[pagination]
pagerSize = 5

[taxonomies]
tags = "tags"
categories = "categories"

[[menu.main]]
identifier = "notes"
name = "Notes"
url = "/notes/"
pre = """
