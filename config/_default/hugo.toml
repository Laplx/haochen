[markup]
defaultMarkdownHandler = "goldmark"

  [markup.goldmark.renderer]
  unsafe = true

  [markup.highlight]
  noClasses = false

  [markup.tableOfContents]
  endLevel = 6
  ordered = false
  startLevel = 2
